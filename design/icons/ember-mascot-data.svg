  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#space)"/>
  <g fill="#dfe4ff">
    <circle cx="150" cy="86" r="2"/><circle cx="78" cy="250" r="2"/><circle cx="120" cy="420" r="2"/>
    <circle cx="430" cy="430" r="2.5"/><circle cx="256" cy="60" r="2"/><circle cx="446" cy="160" r="2"/>
