      <stop offset="0" stop-color="#1d2038"/><stop offset="1" stop-color="#0c0d15"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="54%" r="52%">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.45"/><stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
