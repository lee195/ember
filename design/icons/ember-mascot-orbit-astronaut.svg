<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ember mascot with astronaut">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2038"/><stop offset="1" stop-color="#0c0d15"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="54%" r="52%">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.5"/><stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coal" cx="50%" cy="40%" r="64%">
      <stop offset="0" stop-color="#fff3cf"/><stop offset="0.42" stop-color="#ffb14a"/>
      <stop offset="0.78" stop-color="#ff6a32"/><stop offset="1" stop-color="#c8301f"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#space)"/>

  <!-- stars -->
  <g fill="#dfe4ff">
    <circle cx="92" cy="118" r="3"/><circle cx="150" cy="86" r="2"/><circle cx="430" cy="140" r="3"/>
    <circle cx="78" cy="250" r="2"/><circle cx="96" cy="404" r="2.5"/><circle cx="412" cy="426" r="3"/>
    <circle cx="360" cy="452" r="2"/><circle cx="256" cy="62" r="2"/>
  </g>
  <!-- sparkles -->
  <g fill="#ffd16b">
    <path d="M118 150 C122 159 122 159 131 163 C122 167 122 167 118 176 C114 167 114 167 105 163 C114 159 114 159 118 150 Z"/>
    <path d="M414 138 C417 145 417 145 424 148 C417 151 417 151 414 158 C411 151 411 151 404 148 C411 145 411 145 414 138 Z"/>
  </g>

  <!-- orbit ring (behind) -->
  <g transform="rotate(-18 256 278)">
    <ellipse cx="256" cy="278" rx="170" ry="66" fill="none" stroke="#7e8ff0" stroke-opacity="0.55" stroke-width="4"/>
  </g>

  <!-- glow + planet body -->
  <circle cx="256" cy="276" r="150" fill="url(#halo)"/>
  <rect x="150" y="170" width="212" height="212" rx="94" fill="url(#coal)"/>

  <!-- planet face -->
  <g fill="#3a1206"><ellipse cx="226" cy="262" rx="13" ry="18"/><ellipse cx="286" cy="262" rx="13" ry="18"/></g>
  <g fill="#fff7e6"><circle cx="221" cy="255" r="4.5"/><circle cx="281" cy="255" r="4.5"/></g>
  <g fill="#ff5630" opacity="0.4"><circle cx="202" cy="294" r="12"/><circle cx="310" cy="294" r="12"/></g>
  <path d="M222 300 Q256 328 290 300" fill="none" stroke="#3a1206" stroke-width="10" stroke-linecap="round"/>

  <!-- motion trail behind the ember-naut (fading up the orbit) -->
  <g fill="#ffb14a">
    <circle cx="388" cy="292" r="5" opacity="0.5"/>
    <circle cx="406" cy="266" r="4" opacity="0.32"/>
    <circle cx="418" cy="240" r="3" opacity="0.18"/>
  </g>

  <!-- mini ember-naut floating on the front of the orbit -->
  <g transform="translate(382 330) rotate(8)">
    <line x1="0" y1="-30" x2="0" y2="-40" stroke="#d7e2ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-44" r="4" fill="#ff7a45"/>
    <circle cx="0" cy="0" r="23" fill="url(#coal)"/>
    <g fill="#3a1206"><circle cx="-7" cy="-3" r="3.2"/><circle cx="7" cy="-3" r="3.2"/></g>
    <path d="M-8 6 Q0 13 8 6" fill="none" stroke="#3a1206" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-2" r="30" fill="#cfe0ff" fill-opacity="0.12" stroke="#d7e2ff" stroke-opacity="0.65" stroke-width="3"/>
    <path d="M-21 -12 A30 30 0 0 1 -6 -29" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
