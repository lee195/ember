<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ember mascot">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2038"/>
      <stop offset="1" stop-color="#0c0d15"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="54%" r="52%">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coal" cx="50%" cy="40%" r="64%">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.42" stop-color="#ffb14a"/>
      <stop offset="0.78" stop-color="#ff6a32"/>
      <stop offset="1" stop-color="#c8301f"/>
    </radialGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#space)"/>

  <!-- stars -->
  <g fill="#dfe4ff">
    <circle cx="96" cy="120" r="3"/>
    <circle cx="150" cy="92" r="2"/>
    <circle cx="92" cy="250" r="2.5"/>
    <circle cx="120" cy="392" r="2"/>
    <circle cx="404" cy="404" r="3"/>
    <circle cx="436" cy="250" r="2"/>
    <circle cx="360" cy="86" r="2"/>
    <circle cx="256" cy="64" r="2"/>
  </g>

  <!-- comet streaking down -->
  <path d="M150 96 L196 142" stroke="url(#comet)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="198" cy="144" r="9" fill="#eef4ff"/>

  <!-- warm sparkles -->
  <g fill="#ffd16b">
    <path d="M404 150 C408 159 408 159 417 163 C408 167 408 167 404 176 C400 167 400 167 391 163 C400 159 400 159 404 150 Z"/>
    <path d="M110 350 C113 357 113 357 120 360 C113 363 113 363 110 370 C107 363 107 363 100 360 C107 357 107 357 110 350 Z"/>
  </g>

  <!-- glow + body -->
  <circle cx="256" cy="276" r="150" fill="url(#halo)"/>
  <rect x="150" y="170" width="212" height="212" rx="94" fill="url(#coal)"/>

  <!-- face: open eye + wink -->
  <ellipse cx="226" cy="262" rx="13" ry="18" fill="#3a1206"/>
  <circle cx="221" cy="255" r="4.5" fill="#fff7e6"/>
  <path d="M272 264 Q286 250 300 264" fill="none" stroke="#3a1206" stroke-width="9" stroke-linecap="round"/>
  <g fill="#ff5630" opacity="0.4">
    <circle cx="202" cy="294" r="12"/>
    <circle cx="310" cy="294" r="12"/>
  </g>
  <path d="M222 300 Q256 328 290 300" fill="none" stroke="#3a1206" stroke-width="10" stroke-linecap="round"/>
</svg>
